# Temporary source-selection spike for the class-actions tool.
#
# Round 1 established that a runner can fetch Nevo, but Nevo's robots.txt disallows
# automated access. Round 2 evaluates the courts' official public register and the
# open-data publications of the same record, preferring structured data over scraping.
# Removed once a source is chosen and the work moves to its own repo.
name: source-spike

on:
  push:
    branches: [claude/nevo-class-actions-scraper-qpi8m2]
    paths:
      - 'spike/**'
      - '.github/workflows/nevo-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe court register and open-data sources
        run: python3 spike/probe_sources.py

      - name: Upload captured HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevo-html
          path: out/
          if-no-files-found: warn
